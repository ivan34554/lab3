spring.application.name=lab3

# Чувствительные данные (пароль БД и т.п.) лежат в файле .env, который не попадает в git.
# Шаблон: .env.example. Переменные окружения с теми же именами имеют приоритет.
spring.config.import=optional:file:.env[.properties]

# Подключение к БД: приложение работает под ограниченным пользователем (только DML, без DDL).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/podcasts}
spring.datasource.username=${DB_USERNAME:podcast_app}
spring.datasource.password=${DB_PASSWORD}

# Схему создают SQL-скрипты из папки db/, Hibernate её только проверяет.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
